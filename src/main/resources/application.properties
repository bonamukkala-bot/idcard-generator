# --- Database: uses Render's Postgres env vars if present, else falls back to local H2 ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:idcarddb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# --- H2 web console (only meaningful when running locally with H2) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- File upload settings ---
app.upload.dir=uploads/photos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Server: Render injects PORT; falls back to 8080 locally ---
server.port=${PORT:8080}
